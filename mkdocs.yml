site_name: ECOSALA — Coletivo de Formação e Ação em Agroecologia
site_description: Documentação do coletivo — atas, planos, editais e membros
site_url: https://takwaratec.github.io/ECOSALA
repo_url: https://github.com/takwaratec/ECOSALA
repo_name: takwaratec/ECOSALA
edit_uri: edit/main/docs/
copyright: "© ECOSALA, 2026 · Organização documental e infraestrutura digital: Tecnologia Takwara"

extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Modo claro
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Modo escuro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - footnotes
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

exclude_docs: |
  10_BNDES_BIOINSUMOS/**
  11_ESTUDOS_TECNICOS/**
  12_REUNIOES/*.txt
  12_REUNIOES/MEMORIAL_REUNIAO_2026-05-05*
  ANAMNESE_TERRITORIO_ATORES.md
  Cooperativas_de_manejo.md
  Estufas_Geodesicas.md
  a1.*
  daniela-maciel.md
  editais/**
  mensagem-*.md

nav:
  - Início: index.md
  - 🧭 Diretrizes: DIRETRIZES_ORGANIZACAO_COMPARTILHAMENTO.md
  - 🗂️ Inventário de publicação: INVENTARIO_PUBLICACAO_MKDOCS.md
  - 🚐 Projeto ECOSALA Itinerante: ecosala-itinerante.md
  - 🌱 Reforma Agrária e Agrofloresta: territorios/reforma-agraria-agrofloresta.md
  - 📋 Reuniões e organização:
    - Reunião inaugural 05/05/2026: ata-05-05-2026.md
    - Alinhamento 07/07/2026: 12_REUNIOES/2026-07-07_REUNIAO_ALINHAMENTO_FINEP_ECOSALA.md
    - Identidade e territórios 14/07/2026: 12_REUNIOES/2026-07-14_MEMORIA_REUNIAO_IDENTIDADE_TERRITORIOS.md
    - Status e pauta 30/07/2026: 12_REUNIOES/2026-07-30_STATUS_PAUTA_ORGANIZACAO.md
    - Organização e encaminhamentos 04/08/2026: 12_REUNIOES/2026-08-04_ATA_REUNIAO_ORGANIZACAO_ECOSALA.md
  - 📚 Referências de organização:
    - Mapa de governança do ECOSALA: referencias/mapa-governanca-ecosala.md
    - Organização civil e salvaguardas: referencias/organizacao-civil-e-salvaguardas.md
    - Metodologias participativas: referencias/metodologias-planejamento-participativo.md
  - 🔗 Acervo Científico: https://takwaratec.github.io/acervo-soberania-tecnologica/
